<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AtCoder Study Notes</title>
    <meta name="description" content="AtCoder の学習メモを、数日後の自分にも読める解説記事として整理するページです。">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-grid">
        <div>
          <p class="label">AtCoder Study Notes</p>
          <h1>問題ごとの学習ノート</h1>
          <p class="lead">
            AtCoder の学習内容を、後から読み返せる解説記事として清書していくページです。
            学習用データと公開用記事は分け、公開ページには整理済みの説明だけを置きます。
          </p>
        </div>
      </div>
    </header>

    <main>
      <section class="wrap intro">
        <div class="problem-box">
          <span class="problem-tag">Index</span>
          <h2>公開済みの記事</h2>
          <p>
            現在は試作として1問だけ公開しています。今後、同じ形式で問題ごとの記事を追加していきます。
          </p>
        </div>
      </section>

      <section class="wrap article-section">
        <div class="article-list">
          <article class="article-card">
            <p class="article-meta">ABC276 E</p>
            <h2><a href="./problems/abc276-e/">Round Trip</a></h2>
            <p>
              <code>S</code> の隣接マス同士が、<code>S</code> を通らずにつながっているかを調べる問題。
            </p>
            <a class="read-link" href="./problems/abc276-e/">記事を読む</a>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
